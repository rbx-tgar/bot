[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["Liam Dvorscak <liam.dvorscak1@gmail.com>"]
edition = "2024"
version = "0.1.0"
rust-version = "1.86.0"
description = "TGAR game integration"

[workspace.dependencies]
actix-web = "4.10.2"
async-once-cell = "0.5.4"
mongodb = { version = "3.2.3", features = ["tracing-unstable"] }
once_cell = "1.21.1"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serenity = { git = "https://github.com/serenity-rs/serenity.git", rev = "9d22019" }
tokio = { version = "1.44.1", features = ["full"] }
tgar-rblx-api = { version = "0.35.0", registry = "sculk" }
tracing = "0.1.41"
tracing-actix-web = "0.7.16"
tracing-subscriber = "0.3.19"

[profile.dev]
lto = false
debug = true
rpath = false
panic = "unwind"
opt-level = 0
incremental = true
codegen-units = 256
overflow-checks = true
debug-assertions = true

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = 3
incremental = false
codegen-units = 1
debug-assertions = false

